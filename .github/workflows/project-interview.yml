name: Project interview release validation
on:
  push:
    branches: [main]
    paths: ['project-interview/**', '.github/workflows/project-interview.yml']
  pull_request:
    paths: ['project-interview/**', '.github/workflows/project-interview.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  interview:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify index and answer-driven interview
        working-directory: project-interview
        run: npm test
      - name: Install locked MCP dependencies
        working-directory: project-interview
        run: npm ci --ignore-scripts
      - name: Clean standalone deployment, MCP and assessment report
        working-directory: project-interview
        run: npm run test:release
      - uses: actions/upload-artifact@v4
        with:
          name: project-interview-${{ matrix.os }}
          path: project-interview/release/*
          if-no-files-found: error
