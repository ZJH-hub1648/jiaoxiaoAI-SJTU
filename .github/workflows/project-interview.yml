name: Project interview stages 1–3
on:
  push:
    branches: [main]
    paths: ['project-interview/**', '.github/workflows/project-interview.yml']
  pull_request:
    paths: ['project-interview/**', '.github/workflows/project-interview.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  interview:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify index and answer-driven interview
        working-directory: project-interview
        run: npm test
